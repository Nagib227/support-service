name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: support-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Проверка и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Подготовка JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Подготовка Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Форматирование Java и Kotlin
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck --no-daemon

      - name: Сборка и автоматизированные тесты
        run: ./gradlew test --no-daemon

      - name: Публикация отчётов о тестах и покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          if-no-files-found: warn

  image:
    name: Образ и проверка запуска
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/support-service" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Сборка контейнерного образа
        run: docker build -t "support-service:${{ github.sha }}" .

      - name: Запуск и проверка работоспособности
        run: |
          export APP_IMAGE="support-service:${{ github.sha }}"
          docker compose -p support-ci up -d --wait --no-build
          bash scripts/smoke.sh
          docker compose -p support-ci down -v

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация образа с тегом коммита
        run: |
          docker tag "support-service:${{ github.sha }}" "${{ steps.meta.outputs.image }}:${{ github.sha }}"
          docker push "${{ steps.meta.outputs.image }}:${{ github.sha }}"

  deploy:
    name: Доставка на учебный стенд
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Развёртывание по SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Секреты учебного стенда не заданы."
            echo "Образ опубликован и уже проверен запуском в job image."
            echo "Локальный стенд: scripts/deploy-local.ps1 и scripts/rollback.ps1"
            exit 0
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          path="${DEPLOY_PATH:-/opt/support}"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$path' && APP_IMAGE='$IMAGE' docker compose up -d --wait --no-build && curl -fsS http://localhost:8080/actuator/health"
